[workspace]
resolver = "2"
members = [
    "crates/waker-app",
    "crates/waker-core",
    "crates/waker-lab",
    "crates/waker-net",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
eframe = { version = "0.36.2", default-features = false, features = ["android-native-activity", "default_fonts", "wayland", "wgpu", "x11"] }
gotatun = { version = "0.9.2", default-features = false, features = ["device", "ring"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
ipnetwork = "0.21.1"
rand = "0.9.2"
serde = { version = "1.0.226", features = ["derive"] }
smoltcp = { version = "0.14.0", default-features = false, features = ["medium-ip", "proto-ipv4", "socket-icmp", "socket-tcp", "std"] }
thiserror = "2.0.16"
tokio = { version = "1.52.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.41"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
winit = { version = "0.30.13", default-features = false, features = ["android-native-activity", "rwh_06", "wayland", "x11"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
