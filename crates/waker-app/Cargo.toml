[package]
name = "waker-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "waker_app"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "waker"
path = "src/main.rs"

[dependencies]
eframe.workspace = true
image.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
waker-core = { path = "../waker-core" }
waker-net = { path = "../waker-net" }
winit.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
tracing-logcat = "0.1.0"
jni = "0.22.4"

[package.metadata.android]
package = "app.waker.android"
build_targets = ["aarch64-linux-android"]
resources = "android-res"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application]
label = "Waker"
icon = "@mipmap/ic_launcher"

[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"
exported = true
# winit 0.30 cannot safely recreate its NativeActivity event loop; handle
# target-SDK-known configuration changes in place instead of relaunching.
config_changes = "allKnown"

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "waker_app"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[lints]
workspace = true
