[package]
name = "waker-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "waker_app"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "waker"
path = "src/main.rs"

[dependencies]
egui.workspace = true
image.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
waker-core = { path = "../waker-core" }
waker-net = { path = "../waker-net" }

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["game-activity"] }
egui-wgpu = "0.36.2"
jni = "0.22.4"
# android-activity disables ndk's default features; Waker needs rwh_06 for ANativeWindow handles.
ndk = { version = "0.9.0", default-features = false, features = ["rwh_06"] }
pollster = "0.4.0"
raw-window-handle = "0.6.2"
tracing-logcat = "0.1.0"

[package.metadata.android]
package = "app.waker.android"
build_targets = ["aarch64-linux-android"]
resources = "android-res"
java_sources = "android-java"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[package.metadata.android.application]
label = "Waker"
icon = "@mipmap/ic_launcher"

[[package.metadata.android.application.activity]]
name = "com.google.androidgamesdk.GameActivity"
exported = true
config_changes = "allKnown"

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "waker_app"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[lints]
workspace = true
